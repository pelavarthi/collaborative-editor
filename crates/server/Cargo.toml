[package]
name = "collab-server"
version = "0.1.0"
edition = "2021"
description = "WebSocket server for the collaborative editor: rooms and broadcast"
license = "MIT"

[dependencies]
collab-ot = { path = "../ot" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
