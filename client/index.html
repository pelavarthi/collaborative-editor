<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>collab — real-time editor</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; }
      #editor { width: 100%; height: 320px; font: 1rem/1.5 monospace; padding: 0.75rem; box-sizing: border-box; }
      #status { color: #555; margin: 0.5rem 0; }
      #presence { margin: 0.5rem 0; }
      .peer { margin: 0.2rem 0; }
      .dot { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; margin-right: 0.4rem; }
      form { margin-bottom: 1rem; }
      input { padding: 0.3rem; margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>collab</h1>
    <form id="join">
      <label>Room <input id="room" name="room" value="notes" /></label>
      <label>Name <input id="name" name="name" placeholder="your name" /></label>
      <button type="submit">Join</button>
    </form>
    <textarea id="editor" placeholder="Start typing — everyone in the room sees it live."></textarea>
    <p id="status">connecting…</p>
    <div id="presence"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
